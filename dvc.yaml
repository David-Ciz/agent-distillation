# DVC Pipeline Definition
#
# DVC is used ONLY for dataset versioning and reproducibility.
# Training, evaluation and analysis run on LUMI via SLURM — they cannot
# be expressed as `dvc repro` stages because they require sbatch + Singularity.
#
# What DVC does here:
#   - Tracks raw trace inputs and derived datasets with content hashes
#   - `dvc repro` regenerates the CSVs if the raw traces change
#   - `dvc push / pull` syncs datasets to/from remote storage
#
# Everything else (training, eval, analysis) is handled by:
#   - SLURM scripts in task1/scripts/slurm/
#   - MLflow for experiment tracking (metrics, params, artifacts)
#   - 06_analyse_visualize_results.py run locally after rsyncing CSVs

stages:

  # ---------------------------------------------------------------------------
  # Stage 1: Create training dataset from raw traces
  # ---------------------------------------------------------------------------
  create_train_dataset:
    cmd: python task1/scripts/01_create_train_dataset.py
    deps:
      - task1/scripts/01_create_train_dataset.py
      - task1/data/synthetic_traces/
    outs:
      - task1/data/task1_dataset.csv

  # ---------------------------------------------------------------------------
  # Stage 2: Create evaluation dataset from raw eval traces
  # ---------------------------------------------------------------------------
  create_eval_dataset:
    cmd: python task1/scripts/04_create_eval_dataset.py
    deps:
      - task1/scripts/04_create_eval_dataset.py
      - task1/data/synthetic_traces/eval/
    outs:
      - task1/data/task1_eval_dataset.csv

