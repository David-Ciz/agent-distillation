[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-distillation"
version = "0.1.0"
description = "Distilling knowledge from large LLM agents into small, efficient student models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core runtime dependencies (needed to run any part of the pipeline)
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "accelerate>=0.28.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]

# Fine-tuning
train = [
    "peft>=0.10.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",  # QLoRA / quantisation
    "scipy>=1.11.0",
]

# Evaluation & analysis
eval = [
    "scikit-learn>=1.4.0",
    "sentence-transformers>=3.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

# Experiment tracking
tracking = [
    "mlflow>=2.13.0",
    "dvc>=3.50.0",
    # Uncomment the DVC remote backend you need:
    # "dvc-s3>=3.0.0",       # AWS S3 / LUMI object storage
    # "dvc-gdrive>=3.0.0",   # Google Drive
    # "dvc-ssh>=4.0.0",      # SSH / SFTP
]

# AMD / ROCm-specific extras for LUMI
# Install PyTorch with ROCm support separately:
#   pip install torch --index-url https://download.pytorch.org/whl/rocm6.1
lumi = [
    "accelerate>=0.28.0",
]

# Documentation (install with: pip install -e ".[docs]")
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

# Developer tooling  (install with: pip install -e ".[dev]")
dev = [
    # train
    "peft>=0.10.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",
    "scipy>=1.11.0",
    # eval
    "scikit-learn>=1.4.0",
    "sentence-transformers>=3.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    # tracking
    "mlflow>=2.13.0",
    "dvc>=3.50.0",
    # dev tools
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.0.0",
]

# Install everything  (install with: pip install -e ".[all]")
all = [
    "peft>=0.10.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=3.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "mlflow>=2.13.0",
    "dvc>=3.50.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.0.0",
    # docs
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

# ---------------------------------------------------------------------------
# CLI entry points
# ---------------------------------------------------------------------------
# After migrating scripts to Click (see PLAN.md §3.4), these entry points
# will expose a single `agent-distill` command with subcommands.
# Uncomment and adjust once migration is complete.
#
# [project.scripts]
# agent-distill = "agent_distillation.cli:cli"
#
# Subcommands (each maps to a Click command):
#   agent-distill create-dataset     →  01_create_train_dataset.py
#   agent-distill train               →  02 / 03  (--method lora | full)
#   agent-distill create-eval-dataset →  04_create_eval_dataset.py
#   agent-distill evaluate            →  05_model_evaluation.py
#   agent-distill analyze             →  06_analyse_visualize_results.py
#   agent-distill tta                 →  07_tta_experiment.py  (planned)

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_distillation*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agent_distillation --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

